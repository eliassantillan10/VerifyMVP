name: verifymvp

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-verifymvp}
      POSTGRES_USER: ${POSTGRES_USER:-verifymvp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verifymvp}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-verifymvp}:${POSTGRES_PASSWORD:-verifymvp}@db:5432/${POSTGRES_DB:-verifymvp}"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-dev-only-secret-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      CASE_BREAKER_COACH_ENABLED: ${CASE_BREAKER_COACH_ENABLED:-false}
      CASE_BREAKER_GRADING_ENABLED: ${CASE_BREAKER_GRADING_ENABLED:-false}
      LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL:-http://host.docker.internal:1234}
      LM_STUDIO_API_TOKEN: ${LM_STUDIO_API_TOKEN:-}
      LM_STUDIO_MODEL: ${LM_STUDIO_MODEL:-}
      LM_STUDIO_GRADING_MODEL: ${LM_STUDIO_GRADING_MODEL:-}
      LM_STUDIO_TIMEOUT_SECONDS: ${LM_STUDIO_TIMEOUT_SECONDS:-20}
      CASE_BREAKER_COACH_MAX_INPUT_CHARS: ${CASE_BREAKER_COACH_MAX_INPUT_CHARS:-2000}
      CASE_BREAKER_COACH_MAX_OUTPUT_TOKENS: ${CASE_BREAKER_COACH_MAX_OUTPUT_TOKENS:-500}
      CASE_BREAKER_GRADING_MAX_INPUT_CHARS: ${CASE_BREAKER_GRADING_MAX_INPUT_CHARS:-2000}
      CASE_BREAKER_GRADING_MAX_OUTPUT_TOKENS: ${CASE_BREAKER_GRADING_MAX_OUTPUT_TOKENS:-200}
    command: >
      sh -c "python manage.py migrate --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres-data:
